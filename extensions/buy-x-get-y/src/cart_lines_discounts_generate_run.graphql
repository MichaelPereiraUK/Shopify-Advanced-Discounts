query CartInput {
  cart {
    lines {
      id
      quantity
      ruleAttribute: attribute(key: "_bxgy_rule") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "buy-x-range-get-y", key: "function-configuration") {
      jsonValue
    }
  }
}
